<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPEN LATE · Fit QA</title>
<link rel="stylesheet" href="/static/tokens.css">
<style>
/* Internal: is the grading right, and are the models fit to publish? Nothing here belongs on the customer page. */
.qa{max-width:1280px;margin:0 auto;padding:18px 24px 36px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar h1{margin:0 auto 0 0;font-size:20px;font-weight:650}
.seg{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--hover);border-radius:9px;padding:2px}
.seg button{min-height:34px;border:0;background:none;border-radius:7px;padding:4px 12px;color:var(--t3);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--t1);font-weight:600;box-shadow:0 0 0 1px var(--line2)}
select{min-height:38px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:4px 10px}
.notice{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.notice .btn{margin-left:auto}
.lineup{position:relative;height:calc(100vh - var(--shell) - 148px);min-height:420px;border-radius:14px;overflow:hidden;background:var(--studio)}
.lineup .skel{position:absolute;inset:0;border-radius:0}
.ruler{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(24,24,27,.22);pointer-events:none}
.ruler span{position:absolute;left:8px;top:-9px;font-size:12px;color:var(--t2);background:var(--studio);padding:0 3px}
.five{position:absolute;inset:0;z-index:1;display:grid;grid-template-columns:repeat(5,1fr)}
.fig{position:relative;overflow:hidden;border:0;padding:0;background:none}
.fig img{position:absolute;top:0;height:100%;width:auto;max-width:none;left:50%;transform:translateX(-50%);pointer-events:none}
.lab{position:absolute;left:0;right:0;top:8px;z-index:2;text-align:center;font-size:13px;color:var(--t2);line-height:1.3}
.lab b{display:block;font-size:15px;color:var(--t1)}
.ai{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12px;font-weight:600;color:#fff;background:rgba(24,24,27,.78);border-radius:6px;padding:3px 8px}
.foot{display:flex;align-items:center;gap:12px;color:var(--t3);font-size:14px}
.foot .btn{margin-left:auto}
.toasts{position:fixed;top:58px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:40;width:320px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--c);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
@media(max-width:820px){.qa{padding:12px 12px 28px}.lineup{height:64vh;min-height:0}}
</style>
</head>
<body>
<header id="ol-shell" data-page="fit-qa" data-ops></header>
<script src="/static/shell.js"></script>

<main class="qa">
  <div class="bar">
    <h1>Fit QA</h1>
    <div class="seg" id="mode" role="group" aria-label="Lineup"></div>
    <div class="seg" id="gender" role="group" aria-label="Body type"></div>
    <select id="group" aria-label="Model group"></select>
    <select id="garment" aria-label="Colour"></select>
    <select id="body" aria-label="Body" hidden></select>
  </div>
  <div id="notice"></div>
  <div class="lineup" id="lineup"><div class="skel"></div></div>
  <div class="foot" id="foot"></div>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const CANVAS_H = 1024, FLOOR_Y = 980, PX_PER_CM = (980 - 24) / 200;
const cmTop = cm => (FLOOR_Y - cm * PX_PER_CM) / CANVAS_H * 100;
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
};
const put = (node, ...kids) => node.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false));
const api = async (path, opts = {}) => {
  const r = await fetch(path, {headers: {"content-type": "application/json"}, ...opts});
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.detail || r.statusText);
  return b;
};
function toast(msg, tone = "ok") {
  const t = el("div", {class: "toast", style: `--c:var(--${tone})`}, msg);
  $("toasts").prepend(t); setTimeout(() => t.remove(), 6000);
}
const keyOf = (mid, gid, s) => `${mid}__${gid}__${s}`;
const ETH = [["east_asian", "East Asian"], ["white", "White"], ["black", "Black"], ["arab", "Arab"]];

let cat = null;
const ui = {mode: "graded", gender: "female", group: "east_asian", garment: "inknavy-apricot", size: "M"};
try { Object.assign(ui, JSON.parse(localStorage.getItem("ol-qa") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("ol-qa", JSON.stringify(ui)); } catch (e) {} };
const set = (k, v) => { ui[k] = v; save(); render(); };

function controls() {
  const seg = (id, items, key) => put($(id), items.map(([v, l]) => el("button", {type: "button", "aria-pressed": String(ui[key] === v), onclick: () => set(key, v)}, l)));
  seg("mode", [["graded", "Each in own size"], ["ladder", "One body, all sizes"]], "mode");
  seg("gender", [["female", "Women"], ["male", "Men"]], "gender");
  const sel = (id, items, key) => { const s = $(id); put(s, items.map(([v, l]) => el("option", {value: v}, l))); s.value = ui[key]; s.onchange = () => set(key, s.value); };
  sel("group", ETH, "group");
  sel("garment", cat.garments.map(g => [g.id, g.name]), "garment");
  sel("body", cat.sizes.map(s => [s, `Body ${s}`]), "size");
  $("body").hidden = ui.mode !== "ladder";
}
// [person, size they wear] for the five places of the lineup
function places() {
  const person = s => cat.models.find(x => x.gender === ui.gender && x.ethnicity === ui.group && x.size === s);
  return cat.sizes.map(s => ui.mode === "graded" ? [person(s), s] : [person(ui.size), s]).filter(([m]) => m);
}
function renderLineup() {
  const rulers = [150, 160, 170, 180].map(h => el("div", {class: "ruler", style: `top:${cmTop(h)}%`}, el("span", {}, `${h} cm`)));
  const figs = places().map(([m, s]) => {
    const r = cat.renders[keyOf(m.id, ui.garment, s)], f = m.fits?.[s];
    return el("div", {class: "fig"}, el("img", {src: r ? (r.cutout || r.staged || r.url) : (m.cutout || m.staged || m.portrait), alt: `${s}, ${m.height_cm} cm`, style: r ? null : "opacity:.45"}),
      el("div", {class: "lab"}, el("b", {}, s), `${m.height_cm} cm`, f ? ` · ${f.fit}` : "", r ? null : " · no image"));
  });
  put($("lineup"), ...rulers, el("div", {class: "five"}, figs), el("span", {class: "ai"}, "Virtual model · AI-generated image"));
}
function renderNotice() {
  const missing = cat.models.filter(m => !m.portrait).length, stale = cat.models.filter(m => m.stale).length, off = cat.models.filter(m => m.order_issue);
  const act = (payload, label) => el("button", {type: "button", class: "btn", disabled: !cat.engine.online, onclick: async () => {
    try { const r = await OL.wait(api("/api/fitting/models/build", {method: "POST", body: JSON.stringify(payload)})); toast(`Started ${r.queued} model photos`); refresh(); }
    catch (e) { toast(e.message, "bad"); } }}, label);
  put($("notice"), missing ? el("div", {class: "notice"}, `${missing} models have no photo`, act({}, "Generate"))
    : stale ? el("div", {class: "notice"}, `${stale} model photos use an old prompt`, act({stale: true}, "Update"))
    : off.length ? el("div", {class: "notice"}, `${off.length} bodies fail the size order: ${off.slice(0, 3).map(m => m.id).join(", ")}`, act({reroll: true}, "Re-roll")) : null);
}
function renderFoot() {
  const todo = places().filter(([m, s]) => !cat.renders[keyOf(m.id, ui.garment, s)]);
  put($("foot"), ui.mode === "graded" ? "Grading review: the people each size is drafted for." : "Same body in every size: the comparison customers see.",
    todo.length ? el("button", {type: "button", class: "btn primary", disabled: !cat.engine.online, onclick: () => run(todo)}, `Make ${todo.length} images`) : null);
}
async function run(todo) {
  try {
    await OL.wait(Promise.all(todo.map(([m, s]) => api("/api/fitting/tryon", {method: "POST", body: JSON.stringify({model: m.id, garment: ui.garment, size: s})}))));
    toast(`Queued ${todo.length} images`); refresh();
  } catch (e) { toast(e.message, "bad"); }
}
function render() { if (!cat) return; controls(); renderNotice(); renderLineup(); renderFoot(); }

let timer;
async function refresh() {
  try { cat = await OL.wait(api("/api/fitting/catalog")); render(); } catch (e) { toast(e.message, "bad"); }
  clearTimeout(timer);
  timer = setTimeout(refresh, cat && cat.engine && cat.engine.queue ? 4000 : 15000);
}
refresh();
</script>
</body>
</html>
